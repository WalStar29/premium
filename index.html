<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invitación Especial - Revelación de Género</title>
    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            /* Fondo elegante con gradiente nocturno de lujo */
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #221e28 100%);
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- KEYFRAMES PARA EL BORDE ANIMADO ROSA Y AZUL --- */
        @keyframes borderAnimatedGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- NUBES DE FONDOS AZUL Y ROSA EXCLUSIVAS --- */
        .clouds-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            filter: blur(45px);
            opacity: 0.55;
        }

        .cloud-blob {
            position: absolute;
            border-radius: 50%;
            animation: floatCloud 12s ease-in-out infinite alternate;
        }

        .cloud-pink {
            background: radial-gradient(circle, rgba(255,105,180,0.8) 0%, rgba(255,182,193,0) 70%);
            width: 320px;
            height: 320px;
            top: -50px;
            left: -50px;
        }

        .cloud-blue {
            background: radial-gradient(circle, rgba(72,202,228,0.8) 0%, rgba(144,224,239,0) 70%);
            width: 350px;
            height: 350px;
            bottom: -60px;
            right: -50px;
            animation-delay: -6s;
        }

        @keyframes floatCloud {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(40px) scale(1.15); }
        }

        /* --- MODAL BIENVENIDA CON BORDE ANIMADO ROSA Y AZUL --- */
        .vip-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(13, 27, 42, 0.88);
            backdrop-filter: blur(16px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .vip-modal-box {
            position: relative;
            background: rgba(18, 30, 49, 0.95);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            max-width: 330px;
            width: 100%;
            animation: modalPop 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Borde dinámico para la Modal */
        .vip-modal-box::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 26px;
            background: linear-gradient(90deg, #ff69b4, #48cae4, #ff8da1, #00b4d8, #ff69b4);
            background-size: 300% 300%;
            animation: borderAnimatedGradient 4s ease infinite;
            z-index: -1;
        }

        @keyframes modalPop {
            0% { transform: scale(0.6) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .gold-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #48cae4 0%, #ff69b4 100%);
            color: #ffffff;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            font-size: 1.2rem;
        }

        .vip-modal-title {
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .vip-modal-text {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 22px;
            font-weight: 300;
        }

        /* BOTÓN BLANCO */
        .btn-gold-action {
            background: #ffffff;
            color: #0d1b2a;
            border: none;
            padding: 13px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Poppins', sans-serif;
        }

        .btn-gold-action:active {
            transform: scale(0.96);
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-wrapper {
            width: 100%;
            height: 100dvh;
            max-width: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
            z-index: 10;
            perspective: 1200px;
        }

        .scene-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SOBRE CON BORDE ANIMADO ROSA Y AZUL --- */
        .envelope-container {
            position: absolute;
            width: 280px;
            height: 185px;
            background: linear-gradient(135deg, #ffffff 0%, #fffdfa 100%);
            border-radius: 14px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            perspective: 1000px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            z-index: 5;
            opacity: 0;
            transform: scale(0.6) translateY(30px);
            pointer-events: none;
        }

        .envelope-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 16px;
            background: linear-gradient(90deg, #ff69b4, #48cae4, #ff8da1, #00b4d8, #ff69b4);
            background-size: 300% 300%;
            animation: borderAnimatedGradient 4s ease infinite;
            z-index: -1;
        }

        .envelope-container.reveal-envelope {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .envelope-container.reveal-envelope:hover {
            transform: scale(1.03);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Solapa Superior del Sobre (Flap) */
        .envelope-container .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 105px solid #fffdf7;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s 0.3s;
            z-index: 7;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        /* Bolsillo Inferior del Sobre */
        .envelope-container .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid #fdf8ee;
            border-right: 140px solid #f8f1e1;
            border-bottom: 100px solid #ffffff;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            z-index: 6;
        }

        /* Sello con Corona */
        .seal-button {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff69b4 0%, #48cae4 100%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 8;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 12px rgba(255, 105, 180, 0.6); }
            50% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 25px rgba(72, 202, 228, 0.95); }
            100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 12px rgba(255, 105, 180, 0.6); }
        }

        .seal-button i {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 2px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        .seal-button span {
            font-size: 7.5px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* ESTADO: SOBRE ABIERTO */
        .envelope-container.open .flap {
            transform: rotateX(180deg);
            z-index: 2;
        }

        /* El sobre se achica y desaparece */
        .envelope-container.shrink-hide {
            transform: scale(0.1) translateY(200px);
            opacity: 0;
            pointer-events: none;
        }

        /* --- TARJETA DESPLEGABLE CON BORDE ANIMADO ROSA Y AZUL --- */
        .invitation-card {
            position: absolute;
            width: 260px;
            max-height: 94dvh;
            background: linear-gradient(180deg, rgba(27, 38, 59, 0.98) 0%, rgba(13, 27, 42, 0.98) 100%);
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            z-index: 3;
            transform: translateY(15px) scale(0.85);
            opacity: 0;
            pointer-events: none;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .invitation-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 22px;
            background: linear-gradient(90deg, #ff69b4, #48cae4, #ff8da1, #00b4d8, #ff69b4);
            background-size: 300% 300%;
            animation: borderAnimatedGradient 4s ease infinite;
            z-index: -1;
        }

        .invitation-card.card-emerge {
            opacity: 1;
            z-index: 20;
            pointer-events: auto;
            position: relative;
            width: 100%;
            max-width: 335px;
            transform: translateY(0) scale(1);
        }

        .vip-top-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Imagen de la Plantilla */
        .invitation-img {
            width: 100%;
            height: auto;
            max-height: 48dvh;
            object-fit: contain;
            border-radius: 10px;
            display: block;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        /* --- CONTEO REGRESIVO --- */
        .countdown-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 6px 4px;
            text-align: center;
            position: relative;
        }

        .countdown-container::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 13px;
            background: linear-gradient(90deg, #ff69b4, #48cae4, #ff8da1, #00b4d8, #ff69b4);
            background-size: 300% 300%;
            animation: borderAnimatedGradient 4s ease infinite;
            z-index: -1;
        }

        .countdown-title {
            font-size: 0.6rem;
            font-weight: 600;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .timer {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .timer-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 42px;
        }

        .timer-number {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            width: 100%;
            padding: 2px 0;
            border-radius: 6px;
        }

        .timer-label {
            font-size: 0.5rem;
            color: #ffffff;
            margin-top: 2px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Botones de Acción */
        .action-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 9px 12px;
            border-radius: 22px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: 'Poppins', sans-serif;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #116b39 100%);
            color: #ffffff;
        }

        .btn-close {
            background: linear-gradient(135deg, #334155 100%, #1e293b 0%);
            color: #ffffff;
        }

        @media (max-height: 667px) {
            .invitation-img {
                max-height: 42dvh;
            }
            .btn {
                padding: 7px 10px;
                font-size: 0.75rem;
            }
        }

        /* Canvas para la Lluvia de Estrellas */
        #canvas-confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- NUBES FLOTANTES DE FONDO AZUL Y ROSA -->
    <div class="clouds-background">
        <div class="cloud-blob cloud-pink"></div>
        <div class="cloud-blob cloud-blue"></div>
    </div>

    <!-- MODAL DE BIENVENIDA -->
    <div class="vip-overlay" id="vip-overlay">
        <div class="vip-modal-box">
            <span class="gold-badge"><i class="fa-solid fa-crown"></i></span>
            <h2 class="vip-modal-title">Madrinas & Tías</h2>
            <p class="vip-modal-text">Tu presencia es vital para este momento tan único. Toca para descubrir tu invitación especial.</p>
            <button class="btn-gold-action" onclick="startVipExperience()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Abrir Invitación
            </button>
        </div>
    </div>

    <canvas id="canvas-confetti"></canvas>

    <div class="main-wrapper">
        <div class="scene-container" id="scene-container">

            <!-- SOBRE INTERACTIVO -->
            <div class="envelope-container" id="envelope" onclick="openEnvelope()">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="seal-button">
                    <i class="fa-solid fa-crown"></i>
                    <span>Toca abrir</span>
                </div>
            </div>

            <!-- TARJETA DESPLEGABLE -->
            <div class="invitation-card" id="card">
                <div class="vip-top-label"><i class="fa-solid fa-star"></i> Invitación Especial <i class="fa-solid fa-star"></i></div>

                <!-- Imagen de la invitación -->
                <img src="carta.png" alt="Invitación Revelación de Género" class="invitation-img">

                <!-- Conteo Regresivo -->
                <div class="countdown-container">
                    <div class="countdown-title">Faltan para el gran día</div>
                    <div class="timer">
                        <div class="timer-box">
                            <span class="timer-number" id="days">00</span>
                            <span class="timer-label">Días</span>
                        </div>
                        <div class="timer-box">
                            <span class="timer-number" id="hours">00</span>
                            <span class="timer-label">Horas</span>
                        </div>
                        <div class="timer-box">
                            <span class="timer-number" id="minutes">00</span>
                            <span class="timer-label">Min</span>
                        </div>
                        <div class="timer-box">
                            <span class="timer-number" id="seconds">00</span>
                            <span class="timer-label">Seg</span>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <!-- WhatsApp -->
                    <a href="https://wa.me/584125952906?text=%C2%A1Hola!%20Confirmo%20mi%20asistencia%20como%20Madrina%2FT%C3%ADa%20a%20la%20Revelaci%C3%B3n%20de%20G%C3%A9nero." 
                       target="_blank" 
                       class="btn btn-whatsapp">
                        <i class="fa-brands fa-whatsapp"></i> Confirmar Asistencia
                    </a>

                    <!-- Botón para cerrar y regresar al sobre -->
                    <button class="btn btn-close" onclick="closeEnvelope()">
                        <i class="fa-solid fa-envelope"></i> Guardar en el sobre
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. Iniciar la Lluvia de Estrellas durante 3 segundos al pulsar "Abrir Invitación"
        function startVipExperience() {
            const modalOverlay = document.getElementById('vip-overlay');
            const envelope = document.getElementById('envelope');

            startStarRainTransition(3000);

            modalOverlay.style.opacity = '0';
            modalOverlay.style.visibility = 'hidden';

            setTimeout(() => {
                envelope.classList.add('reveal-envelope');
            }, 600);
        }

        // 2. Sistema de Lluvia de Estrellas continuas (Rosa y Azul)
        function startStarRainTransition(durationMs) {
            const canvas = document.getElementById('canvas-confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const stars = [];
            const pinkColors = ['#ff69b4', '#ff8da1', '#ffb6c1', '#ffd1dc'];
            const blueColors = ['#48cae4', '#00b4d8', '#90e0ef', '#caf0f8'];
            
            const startTime = Date.now();
            let generating = true;

            function drawStar(cx, cy, spikes, outerRadius, innerRadius, color, rotation) {
                let rot = Math.PI / 2 * 3 + rotation;
                let x = cx;
                let y = cy;
                let step = Math.PI / spikes;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius;
                    y = cy + Math.sin(rot) * outerRadius;
                    ctx.lineTo(x, y);
                    rot += step;

                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                }
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                ctx.restore();
            }

            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const elapsedTime = Date.now() - startTime;

                if (elapsedTime < durationMs && generating) {
                    for (let i = 0; i < 4; i++) {
                        const isPink = Math.random() > 0.5;
                        stars.push({
                            x: Math.random() * canvas.width,
                            y: -20,
                            size: Math.random() * 8 + 5,
                            color: isPink ? pinkColors[Math.floor(Math.random() * pinkColors.length)] : blueColors[Math.floor(Math.random() * blueColors.length)],
                            vx: (Math.random() - 0.5) * 4,
                            vy: Math.random() * 5 + 4,
                            rotation: Math.random() * Math.PI * 2,
                            vRot: (Math.random() - 0.5) * 0.1
                        });
                    }
                }

                let aliveCount = 0;

                stars.forEach(s => {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.rotation += s.vRot;

                    if (s.y < canvas.height + 30) {
                        aliveCount++;
                    }

                    drawStar(s.x, s.y, 5, s.size, s.size / 2, s.color, s.rotation);
                });

                if (elapsedTime < durationMs || aliveCount > 0) {
                    requestAnimationFrame(update);
                }
            }

            update();
        }

        // 3. Conteo Regresivo
        function updateCountdown() {
            const now = new Date();
            let targetYear = now.getFullYear();
            let eventDate = new Date(targetYear, 11, 5, 18, 30, 0);

            if (now > eventDate) {
                eventDate = new Date(targetYear + 1, 11, 5, 18, 30, 0);
            }

            const difference = eventDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((difference / 1000 / 60) % 60);
                const seconds = Math.floor((difference / 1000) % 60);

                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            } else {
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 4. Abrir sobre al presionarlo
        function openEnvelope() {
            const envelope = document.getElementById('envelope');
            const card = document.getElementById('card');

            envelope.classList.add('open');

            setTimeout(() => {
                card.classList.add('card-emerge');
                envelope.classList.add('shrink-hide');
            }, 400);
        }

        // 5. Cerrar tarjeta y volver al sobre
        function closeEnvelope() {
            const envelope = document.getElementById('envelope');
            const card = document.getElementById('card');

            card.classList.remove('card-emerge');
            envelope.classList.remove('shrink-hide');

            setTimeout(() => {
                envelope.classList.remove('open');
            }, 600);
        }
    </script>
</body>
</html>
